<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play — Doom on Robinhood</title>
  <link rel="icon" href="assets/token-circle-c-red-d.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img class="logo" src="assets/token-circle-c-red-d.png" alt="DOOM" width="40" height="40" />
      <div>
        <h1><span>DOOM</span> on Robinhood</h1>
        <p class="hero-sub">Episode 1 shareware · play in the browser</p>
      </div>
    </div>
    <nav class="nav" id="siteNav" aria-label="Primary"></nav>
  </header>

  <main>
    <section class="panel">
      <h2>Play</h2>
      <iframe class="game" src="game/play.html" title="Doom WASM" allow="autoplay; fullscreen; gamepad"></iframe>
      <p class="play-note">
        Click the canvas for keyboard ·
        <a href="game/play.html" target="_blank" rel="noopener">Fullscreen</a>
      </p>
      <p class="play-note" id="feeNote">Freeplay is free · Ranked = $X of $DOOM</p>
    </section>
  </main>

  <footer>
    Scores &amp; fees settle on Robinhood Chain testnet. Game runs in your browser — not in the EVM.
    See <a href="how.html">How it works</a>.
  </footer>
  <script type="module" src="js/play.js"></script>
</body>
</html>
