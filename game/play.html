<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Doom 1 (shareware) — WASM</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    @font-face {
      font-family: "VT323";
      font-style: normal;
      font-weight: 400;
      src: url(https://fonts.gstatic.com/s/vt323/v12/pxiKyp0ihIEF2isfFJXUdVNF.woff2) format("woff2");
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #111; color: #ddd; font-family: VT323, monospace; }
    #wrap { max-width: 930px; margin: 0 auto; padding: 1rem; }
    canvas.frame { background: #000; width: 800px; height: 600px; max-width: 100%; display: block; margin: 0 auto; }
    .hint { text-align: center; opacity: 0.7; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas class="frame" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <p class="hint">Click canvas for keyboard · Episode 1 shareware (doom1.wad) · Chocolate Doom WASM</p>
  </div>
  <script>
    // Local single-player: no multiplayer websocket server required
    var commonArgs = ["-iwad", "doom1.wad", "-window", "-nogui", "-nomusic", "-config", "default.cfg"];
    var Module = {
      onRuntimeInitialized: () => { callMain(commonArgs); },
      noInitialRun: true,
      preRun: () => {
        Module.FS.createPreloadedFile("", "doom1.wad", "doom1.wad", true, true);
        Module.FS.createPreloadedFile("", "default.cfg", "default.cfg", true, true);
      },
      printErr: function (text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
        console.error(text);
      },
      canvas: (function () {
        var canvas = document.getElementById("canvas");
        canvas.addEventListener("webglcontextlost", function (e) {
          alert("WebGL context lost — reload the page.");
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      print: function (text) { console.log(text); },
      setStatus: function (text) { console.log(text); },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");
      },
    };
    window.onerror = function () {
      Module.setStatus("Exception thrown — see console");
    };
  </script>
  <script type="text/javascript" src="websockets-doom.js"></script>
</body>
</html>
