<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101012" />
  <title>Season Pit — $DOOM on PONS</title>
  <link rel="icon" href="assets/token-circle-c-red-d.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="site-header"></header>
    <main class="page">
      <section class="pit" id="season-pit">
        <h2 class="pit-title">SEASON PIT</h2>
        <div class="pit-timer">
          <img class="skull-drip" src="assets/skull-drip.svg" alt="" width="14" height="16" />
          <span class="pit-count" data-countdown title="UTC day ends">--:--:--</span>
        </div>
        <div class="pit-meta">
          <span class="badge">UTC day <span id="dayIdHint">—</span></span>
          <span class="badge accent">today’s prize <span id="dayPrize">—</span></span>
          <span class="badge">pool <span id="poolBal">—</span></span>
          <span class="badge">fee <span id="feeUsd">—</span></span>
        </div>
        <ol class="pit-list" id="pitList">
          <li class="pit-empty">Loading ranked wallets…</li>
        </ol>
        <p class="pit-status" id="pitStatus"></p>
      </section>
    </main>
    <footer>
      Data from DailyArena on Robinhood testnet 46630. Ranked board is wallet-based UTC day.
      Top-3 prize split 50 / 30 / 20 of today’s on-chain pot.
    </footer>
  </div>
  <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
